<!DOCTYPE html>
<html>
<head>
<title>For My Madam ❤️</title>

<style>
body {
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #ffccd5, #ffe6f0);
  margin-top: 50px;
  overflow-x: hidden;
}

.small {
  width: 180px;
  margin: 15px 0;
}

.big {
  width: 320px;
  margin: 20px 0;
}

button {
  padding: 10px 25px;
  font-size: 18px;
  margin: 15px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
  background-color: #ff4d6d;
  color: white;
}

#buttons {
  position: relative;
  margin-top: 20px;
}

#noBtn {
  position: absolute;
  left: 60%;
}

#hearts {
  font-size: 35px;
  animation: float 1.5s infinite alternate;
}

@keyframes float {
  from { transform: translateY(0px); }
  to { transform: translateY(-15px); }
}
</style>
</head>

<body>

<audio id="bgMusic" src="soodu soodu.mp3"></audio>

<div id="content">
  <img src="1st.png" class="small">
  <h2>Hello Madam 😘 Do you love me?</h2>
</div>

<div id="buttons">
  <button onclick="nextStep()">Yes</button>
  <button id="noBtn" onmouseover="moveButton()">No</button>
</div>

<script>

let step = 1;

function moveButton() {
  let btn = document.getElementById("noBtn");
  let x = Math.random() * 300;
  let y = Math.random() * 100;
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}

function nextStep() {

  if(step == 1){
    document.getElementById("content").innerHTML =
      '<img src="2nd.png" class="small">' +
      '<h2>You have a surprise 💝 Do you want to open?</h2>';
    step++;
  }

  else if(step == 2){
    document.getElementById("content").innerHTML =
      '<h2>Hehe nothing here 😜</h2>' +
      '<img src="3rd.jpg" class="small">' +
      '<h3>Just kidding click next</h3>';

    document.getElementById("buttons").innerHTML =
      '<button onclick="nextStep()">Next</button>';
    step++;
  }

  else if(step == 3){
    document.getElementById("content").innerHTML =
      '<h2>Boom 💥</h2>' +
      '<img src="bb.jpeg" class="small">' +
      '<h3>Sarle yedavaku 😂 Idi ni surprise click to open</h3>';

    document.getElementById("buttons").innerHTML =
      '<button onclick="nextStep()">Open</button>';
    step++;
  }

  else if(step == 4){

    document.getElementById("content").innerHTML =
      '<div id="hearts">💖💖💖💖💖</div>' +
      '<h1>I Love You So Much ❤️</h1>' +
      '<img id="slideshow" src="final1.jpeg" class="big">' +
      '<h2>You Are My Everything 💕</h2>';

    document.getElementById("buttons").style.display = "none";

    document.getElementById("bgMusic").play();

    startSlideshow();
  }

}

function startSlideshow(){

  let images = [
    "final1.jpeg",
    "final2.jpeg",
    "final3.jpeg",
    "final4.jpeg",
    "final5.jpeg"
  ];

  let index = 0;

  setInterval(function(){
    index++;
    if(index >= images.length){
      index = 0;
    }
    document.getElementById("slideshow").src = images[index];
  }, 4000); // change every 4 seconds

}

</script>

</body>

</html>
